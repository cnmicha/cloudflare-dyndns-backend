# Local PostgreSQL for development. Start with `npm run db:up`, stop with `npm run db:down`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: cloudflare-dyndns_dev_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cloudflare-dyndns
    ports:
      # Loopback only: reachable from the devcontainer (and the host via VS Code port forwarding), not the network
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudflare-dyndns"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_dev:
